[project]
name = "nws-alert-bot"
version = "2.0.0"
description = "NWS Alert Bot — Pacific Northwest Enhanced Edition"
requires-python = ">=3.12"
dependencies = []

[tool.pixi.workspace]
channels  = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"

[tool.pixi.pypi-dependencies]
tweepy   = ">=4.14,<5"
requests = ">=2.32,<3"
metpy    = ">=1.6,<2"
siphon   = ">=0.9,<1"
numpy    = ">=1.26,<3"

[tool.pixi.tasks]
bot     = "python bot/main.py"
dry-run = { cmd = "python bot/main.py", env = { DRY_RUN = "1" } }
check   = "python -c \"import requests,json; r=requests.get('https://api.weather.gov/alerts/active/area/WA',headers={'User-Agent':'test','Accept':'application/geo+json'}); d=r.json(); print(f'{len(d[\\\"features\\\"])} active WA alerts')\""

[tool.pixi.feature.dev.dependencies]
pytest = ">=8,<9"
ruff   = ">=0.4,<1"

[tool.pixi.feature.dev.tasks]
lint = "ruff check bot/"
fmt  = "ruff format bot/"
test = "pytest tests/ -v"

[tool.pixi.environments]
default = { features = [],      solve-group = "default" }
dev     = { features = ["dev"], solve-group = "default" }
