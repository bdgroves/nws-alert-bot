name: NWS Alert Bot

on:
  schedule:
    # Run every 5 minutes — GitHub Actions minimum interval
    - cron: "*/5 * * * *"
  workflow_dispatch:  # Manual trigger from the Actions tab

permissions:
  contents: write  # Needed to commit the cache file back to the repo

jobs:
  post-alerts:
    name: Fetch & Post NWS Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 4  # Must finish before the next 5-min run

    steps:
      # ── 1. Checkout (includes posted_ids.json cache if it exists) ───────────
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ── 2. Set up pixi + install dependencies ────────────────────────────────
      #    setup-pixi reads pyproject.toml, installs the pixi env, and caches it
      #    using the pixi.lock hash — so repeat runs are very fast.
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.41.4   # pin to avoid surprise breaking changes
          cache: true              # cache the conda env between runs

      # ── 3. Run the bot inside the pixi environment ────────────────────────────
      - name: Run NWS Alert Bot
        env:
          TWITTER_API_KEY:       ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:    ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:  ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          LOOKBACK_MINUTES:      "120"
          CACHE_FILE:            "posted_ids.json"
        run: pixi run bot

      # ── 4. Commit the updated cache file back to the repo ────────────────────
      #    This is how the bot "remembers" what it already posted across runs.
      - name: Save alert cache to repo
        run: |
          git config user.name  "NWS Alert Bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted_ids.json || true
          git diff --cached --quiet || git commit -m "chore: update alert cache [skip ci]"
          git push || echo "Nothing to push"
